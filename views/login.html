<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <title>Login - Space_Shooter</title>
</head>

<body class="handheld">
  <main class="desk">
    <a class="back-link" href="../">&lt; BACK</a>

    <!-- The handheld console. Only the form inside the screen is interactive;
           the rest (LED, speaker, buttons) is decoration. -->
    <div class="device">
      <div class="device-top" aria-hidden="true">
        <span class="led"></span>
        <span class="brand">SPACE<b>_</b>SHOOTER</span>
        <span class="model">LCD-01 · DOT MATRIX</span>
      </div>

      <div class="bezel">
        <div class="screen" data-testid="screen">
          <div class="lcd">
            <canvas data-testid="lcd-canvas" aria-hidden="true"></canvas>
          </div>
          <p class="banner" data-testid="banner" aria-hidden="true" hidden></p>

          <section class="panel" data-testid="login" data-state="idle" aria-labelledby="login-title">
            <div class="login-container">
              <!-- Top Navigation Bar -->
              <div class="login-form_header">
                <button type="button" class="mode" id="prevBtn" aria-label="Previous mode">&lt;</button>
                <span class="state-title" id="stateTitle">Guest</span>
                <button type="button" class="mode" id="nextBtn" aria-label="Next mode">&gt;</button>
              </div>

              <!-- State 1: Guest -->
              <form class="login-form active" data-title="Guest" action="./views/game.html">
                <button type="submit" class="mode w100" aria-pressed="true">PLAY</button>
              </form>

              <!-- State 2: Login -->
              <form class="login-form" data-title="Login" method="post" novalidate>
                <div class="form-group">
                  <label for="username">PILOT ID</label>
                  <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"
                    maxlength="16" required />
                </div>
                <div class="form-group">
                  <label for="password">PASSCODE</label>
                  <input id="password" name="password" type="password" autocomplete="current-password" required />
                  <p class="hint" data-testid="login-hint">3-16 LETTERS, NUMBERS OR _</p>
                </div>
                <button type="submit" class="mode w100" aria-pressed="true">PRESS START</button>
              </form>

              <!-- State 3: New pilot -->
              <form class="login-form" data-title="New pilot" method="post" novalidate>
                <div class="form-group">
                  <label for="username">PILOT ID</label>
                  <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"
                    maxlength="16" required />
                </div>
                <div class="form-group">
                  <label for="password">PASSCODE</label>
                  <input id="password" name="password" type="password" autocomplete="current-password" required />
                  <p class="hint" data-testid="login-hint">3-16 LETTERS, NUMBERS OR _</p>
                </div>
                <button type="submit" class="mode w100" aria-pressed="true">NEW GAME</button>
              </form>
            </div>

            <p class="status" data-testid="login-status" role="status" hidden></p>
          </section>

          <div class="glare" aria-hidden="true"></div>
        </div>
      </div>

      <div class="controls" aria-hidden="true">
        <div class="dpad"><span></span></div>
        <div class="speaker"></div>
        <div class="ab">
          <button type="button" tabindex="-1" data-fire>B</button>
          <button type="button" tabindex="-1" data-fire>A</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/login.js"></script>
</body>

</html>
