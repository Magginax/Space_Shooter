<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <title>Game - Space_Shooter</title>
</head>

<body class="handheld">
    <main class="desk">
        <a class="back-link" href="../">&lt; BACK</a>

        <p class="player-bar" data-testid="player-bar" hidden>
            Playing as <strong data-testid="player-name"></strong>
            <span data-testid="guest-note" hidden>(guest: scores are not saved)</span>
            <a data-testid="account-link" href="./login.html">Account</a>
        </p>

        <!-- The handheld console. Only the game inside the screen is interactive;
           the rest (LED, speaker, buttons) is decoration. -->
        <div class="device">
            <div class="device-top" aria-hidden="true">
                <span class="led"></span>
                <span class="brand">SPACE<b>_</b>SHOOTER</span>
                <span class="model">LCD-01 · DOT MATRIX</span>
            </div>

            <div class="bezel">
                <div class="screen" data-testid="screen">
                    <!-- .screen > .lcd > canvas: the game sizes itself from the screen. -->
                    <div class="lcd" hidden>
                        <canvas id="game-canvas" data-testid="game-canvas" data-state="idle" data-lives="3" data-score="0" data-level="0" data-xp="0" data-gun="blaster" data-row="" data-locked=""></canvas>
                    </div>
                    <button type="button" class="start-game" data-testid="start-game" hidden>PLAY</button>
                    <button type="button" class="upgrade-back" data-testid="upgrade-back" hidden>BACK</button>
                    <div class="abandon" data-testid="abandon-prompt" data-choice="no" hidden>
                        <p>Abandon this run?</p>
                        <p class="abandon-choices">
                            <span data-testid="abandon-no">NO</span>
                            <span data-testid="abandon-yes">YES</span>
                        </p>
                    </div>
                    <div class="glare" aria-hidden="true"></div>
                </div>
            </div>

            <div class="controls" aria-hidden="true">
                <div class="dpad"><span></span></div>
                <div class="speaker"></div>
                <div class="ab">
                    <button type="button" tabindex="-1" data-fire>B</button>
                    <button type="button" tabindex="-1" data-fire>A</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/src/game.js"></script>
</body>

</html>
