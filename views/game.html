<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <title>Game - Space_Shooter</title>
</head>

<body class="handheld">
    <main class="desk">
        <a class="back-link" href="../">&lt; BACK</a>

        <!-- The handheld console. Only the form inside the screen is interactive;
           the rest (LED, speaker, buttons) is decoration. -->
        <div class="device">
            <div class="device-top" aria-hidden="true">
                <span class="led"></span>
                <span class="brand">SPACE<b>_</b>SHOOTER</span>
                <span class="model">LCD-01 · DOT MATRIX</span>
            </div>

            <div class="bezel">
                <!-- This is the div where the game should be -->
                <div class="screen" data-testid="screen">
                    <!-- <div class="lcd">
                        <canvas data-testid="lcd-canvas" aria-hidden="true"></canvas>
                    </div>
                    <p class="banner" data-testid="banner" aria-hidden="true" hidden></p>

                    <section class="panel" data-testid="login" data-state="idle" aria-labelledby="login-title">
                        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Dolorum repellendus ab perspiciatis
                        iste cumque rem odio magnam, aliquam nesciunt cum magni. Nemo id odit corrupti amet ipsa cumque
                        provident molestiae.
                    </section> -->

                    <div class="glare" aria-hidden="true"></div>
                </div>
            </div>

            <div class="controls" aria-hidden="true">
                <div class="dpad"><span></span></div>
                <div class="speaker"></div>
                <div class="ab">
                    <button type="button" tabindex="-1" data-fire>B</button>
                    <button type="button" tabindex="-1" data-fire>A</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/src/game.js"></script>
</body>

</html>
