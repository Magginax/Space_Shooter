<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Space_Shooter</title>
</head>

<body>
  <header class="site-header">
    <h1>Space_Shooter</h1>
    <nav>
      <a href="./views/error.html">About</a>
      <a href="#game">Game</a>
      <a href="./views/leaderboard.html">Leaderboard</a>
      <a href="./views/login.html">Login</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About</h2>
      <p>A static site template with a small canvas game engine.</p>
    </section>

    <!-- data-access: "checking" -> "granted" (logged in or guest) or "locked". -->
    <section id="game" data-testid="game-section" data-access="checking">
      <h2>Space Shooter</h2>

      <div class="game-lock" data-testid="game-lock" hidden>
        <p data-testid="game-lock-message">Log in to play.</p>
        <a class="button" data-testid="login-to-play" href="./views/login.html">Log in</a>
      </div>

      <div data-testid="game-area" hidden>
        <p class="player-bar" data-testid="player-bar">
          Playing as <strong data-testid="player-name"></strong>
          <span data-testid="guest-note" hidden>(guest: scores are not saved)</span>
          <a data-testid="account-link" href="./views/login.html">Account</a>
        </p>
        <!-- The Space Shooter game draws here (src/games/space-shooter/). -->
        <div class="game-screen" data-testid="game-screen">
          <div class="game-lcd">
            <canvas id="game-canvas" data-testid="game-canvas" data-state="idle" data-lives="3" data-score="0" data-level="0" data-xp="0" data-gun="blaster" data-row="" data-locked=""></canvas>
          </div>
          <button type="button" class="start-game" data-testid="start-game">PLAY</button>
          <button type="button" class="upgrade-back" data-testid="upgrade-back" hidden>BACK</button>
          <div class="abandon" data-testid="abandon-prompt" data-choice="no" hidden>
            <p>Abandon this run?</p>
            <p class="abandon-choices">
              <span data-testid="abandon-no">NO</span>
              <span data-testid="abandon-yes">YES</span>
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
