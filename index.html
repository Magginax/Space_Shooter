<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Space_Shooter</title>
  </head>
  <body>
    <header class="site-header">
      <h1>Space_Shooter</h1>
      <nav>
        <a href="#about">About</a>
        <a href="#game">Game</a>
        <a href="./views/leaderboard.html">Leaderboard</a>
        <a href="./views/login.html">Login</a>
      </nav>
    </header>

    <main>
      <section id="about">
        <h2>About</h2>
        <p>A static site template with a small canvas game engine.</p>
      </section>

      <!-- data-access: "checking" -> "granted" (logged in or guest) or "locked". -->
      <section id="game" data-testid="game-section" data-access="checking">
        <h2>Dodge</h2>

        <div class="game-lock" data-testid="game-lock" hidden>
          <p data-testid="game-lock-message">Log in to play.</p>
          <a class="button" data-testid="login-to-play" href="./views/login.html">Log in</a>
        </div>

        <div data-testid="game-area" hidden>
          <p class="player-bar" data-testid="player-bar">
            Playing as <strong data-testid="player-name"></strong>
            <span data-testid="guest-note" hidden>(guest: scores are not saved)</span>
            <a data-testid="account-link" href="./views/login.html">Account</a>
          </p>
          <p>Use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> (or A / D) to avoid the falling blocks.</p>
          <div class="game-hud">
            <span>Score: <strong data-testid="score">0</strong></span>
            <button type="button" data-testid="start-button">Start</button>
          </div>
          <canvas id="game-canvas" width="480" height="320" data-testid="game-canvas" data-state="idle"></canvas>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
